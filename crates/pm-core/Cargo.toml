[package]
name = "pm-core"
version = "0.0.6"
edition = "2021"
license = "BSD-3-Clause"

[dependencies]
git2 = "0.20"
similar = "2"
anyhow = { workspace = true }
# default-fancy = pure-Rust regex engine, no oniguruma C dependency
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
ignore = "0.4"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "1"
# update check + `pm update` download (PM-14); blocking, rustls, no async runtime
ureq = "2"
# `pm --setup` (PM-5): the "pm" ASCII banner. Prompts are plain stdin reads —
# a TUI prompt lib (dialoguer/console) left Windows Terminal in raw mode (PM-47).
figlet-rs = "0.1"

[target.'cfg(windows)'.dependencies]
# Flushing the console input buffer before each `pm --setup` prompt (PM-60) —
# stray keystrokes queued from an `irm | iex` paste otherwise get consumed as
# the answer instead of the user's actual keypress.
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }
