[package]
name = "pm"
version = "0.1.0"
edition = "2021"
description = "Plus Minus - a diff-oriented code editor"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", branch = "main" }
gpui_platform = { git = "https://github.com/zed-industries/zed", branch = "main" }
git2 = "0.20"
similar = "2"
anyhow = "1"
# default-fancy = pure-Rust regex engine, no oniguruma C dependency
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

[profile.dev]
# gpui does real per-frame layout/text work; unoptimized it feels laggy.
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
