[workspace]
members = ["crates/fremantle", "crates/pm-core", "crates/pm-ui", "crates/pm-mcp", "crates/pm-debug"]

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", branch = "main" }
gpui_platform = { git = "https://github.com/zed-industries/zed", branch = "main" }
anyhow = "1"

[package]
name = "pm"
version = "0.0.5"
edition = "2021"
description = "Plus Minus - a diff-oriented code editor"
license = "BSD-3-Clause"
repository = "https://github.com/GecEnterprises/pm"

[lib]
name = "pm"
path = "src/lib.rs"

[[bin]]
name = "pm"
path = "src/main.rs"

# The distinct development build (`pm-debug`) lives in its own package,
# `crates/pm-debug` — it needs its own build.rs to embed a different Windows
# icon resource (winresource is one resource per crate). `cargo pmd`.

[dependencies]
pm-core = { path = "crates/pm-core" }
pm-ui = { path = "crates/pm-ui" }
pm-mcp = { path = "crates/pm-mcp" }
anyhow = { workspace = true }
gpui = { workspace = true }
# gpui_platform ships no backend by default; pick both Linux backends (the
# features gate `gpui_linux`, which isn't built on Windows/macOS anyway).
gpui_platform = { workspace = true, features = ["wayland", "x11"] }
# window icon (x11 runtime path); must match gpui's image version so the
# RgbaImage types unify
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
# AttachConsole for CLI subcommands under `windows_subsystem = "windows"`
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

[build-dependencies]
winresource = "0.1"

[profile.dev]
# gpui does real per-frame layout/text work; unoptimized it feels laggy.
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
