[package]
name = "pm"
version = "0.1.0"
edition = "2021"
description = "Plus Minus - a diff-oriented code editor"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", branch = "main" }
gpui_platform = { git = "https://github.com/zed-industries/zed", branch = "main" }
git2 = "0.20"
similar = "2"
anyhow = "1"

[profile.dev]
# gpui is large; a touch of optimization keeps the UI responsive while iterating.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
